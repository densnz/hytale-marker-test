name: Release
on:
  push:
    tags: [ "v*" ]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Check that the tag matches the version in gradle.properties
      run: |
        VERSION=$(grep -E '^version *=' gradle.properties | cut -d= -f2 | tr -d ' \r')
        if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in gradle.properties"
          exit 1
        fi
    - name: Build
      run: ./gradlew build
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" build/libs/MarkerTest-*.jar \
          --title "MarkerTest ${GITHUB_REF_NAME}" \
          --notes "Spawn marker test bench for Hytale. Put the jar into %APPDATA%\\Hytale\\UserData\\Mods and see the README for usage."
